[package]
name = "loft"
version = "0.1.0"
edition = "2024"
publish = false
description = "PidgeIoT CoAP terminator: DTLS/UDP + TLS/TCP (RFC 8323) front end translating the CoAP device surface onto dovecote's HTTP device routes"

[dependencies]
# Only for deriving the deserializer on the dovecote wire types in
# src/wire.rs; nothing else here is serde-shaped.
serde.workspace = true
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "time",
  "sync",
  "signal",
] }
# Async upstream client for the data path (dovecote /device/pigeons/:id/*).
# rustls, not native-tls: the upstream is ordinary HTTPS (Cloudflare edge /
# local wrangler dev) -- no PSK needed on this leg.
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "http2",
] }
# Sync client for the PSK resolver ONLY: DTLS/TLS PSK callbacks are
# synchronous FFI-ish callbacks invoked mid-handshake, and bridging an async
# HTTP call into them is where the fragility lives -- a small blocking
# client behind `tokio::task::block_in_place` is simpler and correct on the
# multi-thread runtime. See src/psk.rs.
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
openssl = "0.10"
# Dual-stack listener sockets: std's bind cannot clear IPV6_V6ONLY. See
# loft/src/listen.rs.
socket2 = "0.6"
# DTLSv1_listen for the DTLS listener's stateless cookie exchange -- the
# safe openssl crate does not expose it. See loft/src/dtls.rs module docs.
dtls-ffi-shim = { path = "../dtls-ffi-shim" }
# The RFC 9146 CID listener's stack (docs/infra/coap-cid-design.md).
# Optional because it dynamically links the system mbedTLS 3.6, which dev
# machines may not carry -- the Dockerfile build stage always enables it,
# so every shipped binary is dual-stack; a binary built without it refuses
# LOFT_DTLS_STACK=mbedtls at startup rather than silently downgrading.
mbedtls-ffi-shim = { path = "../mbedtls-ffi-shim", optional = true }

[features]
mbedtls = ["dep:mbedtls-ffi-shim"]
